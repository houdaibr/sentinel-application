apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-deployment
  labels:
    app: ingest
    {{- include "sentinel.labels" . | nindent 4 }}

spec :
  replicas : {{.Values.ingest.replicas}}
  selector :
    matchLabels:
      app: ingest
  strategy :
    {{- toYaml .Values.ingest.strategy | nindent 4 }}

  template :
    metadata :
      name: ingest-pod
      labels:
        app: ingest
    spec:
      terminationGracePeriodSeconds : 20
      initContainers:
        - name: wait-fro-postgres
          image: {{ .Values.postgres.image }}:{{ .Values.postgres.tag }}
          command: ['sh', '-c', 'until pg_isready -h postgres-service -p 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: ingest-container
          image: {{.Values.ingest.image}}:{{.Values.ingest.tag}}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 6
          ports:
          - containerPort: 8080
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12}}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 6
            failureThreshold: 2
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 3
          env:
            - name: APP_VERSION
              value:  {{ .Values.ingest.appVersion | quote }}
          envFrom:
          - configMapRef:
              name: app-config
          - secretRef:
              name: app-secrets
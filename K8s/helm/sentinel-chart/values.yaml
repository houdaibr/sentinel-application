ingest:
  image: ingest-service
  tag: "1.1"
  appVersion : "10.0"
  replicas : 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
postgres:
  image: postgres
  tag: 18
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
pdb :
  minAvailable: 1

ingestSvc :
  port: 80

ingress:
  enabled: true

db:
  # real value lives in values-secrets.yaml (gitignored)
  password: ""

services:
  postgres:
    image: postgres:18
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql
      - ./K8s/helm/sentinel-chart/files/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}"]

  ingest-service:
    container_name: ingest-container
    build:
      context: ./ingest-service
      dockerfile : Dockerfile
    ports:
      - "8089:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_NAME : ${DB_NAME}
      DB_PORT : ${DB_PORT}
      DB_HOST : postgres
    depends_on:
      postgres:
        condition: service_healthy



volumes:
  postgresdata:



